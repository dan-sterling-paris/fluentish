# Supabase project configuration

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "https://dan-sterling-paris.github.io/fluentish/dashboard/"
additional_redirect_urls = ["https://gutihncfxjdyxulfwtgp.supabase.co/storage/v1/object/public/portal/index.html"]
jwt_expiry = 3600
enable_signup = false

[edge_runtime]
enabled = true
policy = "per_worker"

# crm-api: handles all CRUD and SMS-send routes (not scheduled)
[functions.crm-api]
verify_jwt = true

# inbound-webhook: receives ClickSend inbound SMS (not scheduled)
[functions.inbound-webhook]
verify_jwt = false

# sheets-poll: runs every minute to ingest new leads from Google Sheets
[functions.sheets-poll]
verify_jwt = false

# calendly-webhook: receives invitee.created from Calendly; provisions a
# customer portal account for paid bookings and marks their lead as enrolled
[functions.calendly-webhook]
verify_jwt = false

# drip-send: automated follow-up SMS sequence (runs every 5 minutes via pg_cron)
# Sends follow-up 1 at 24h and follow-up 2 at 48h after lead creation,
# adjusted to the next 08:00 UK if outside the 08:00–21:00 working window.
# Halts automatically if the lead has replied (last_message_direction = 'inbound').
# Cron schedule is configured in migration 20260512000002_drip_send_cron.sql
[functions.drip-send]
verify_jwt = false
