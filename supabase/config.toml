# Supabase project configuration

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "https://dan-sterling-paris.github.io/fluentish/dashboard/"
additional_redirect_urls = ["https://gutihncfxjdyxulfwtgp.supabase.co/storage/v1/object/public/portal/index.html"]
jwt_expiry = 3600
enable_signup = false

[edge_runtime]
enabled = true
policy = "per_worker"

# crm-api: handles all CRUD and SMS-send routes (not scheduled)
[functions.crm-api]
verify_jwt = true

# inbound-webhook: receives ClickSend inbound SMS (not scheduled)
[functions.inbound-webhook]
verify_jwt = false

# sheets-poll: runs every minute to ingest new leads from Google Sheets
[functions.sheets-poll]
verify_jwt = false
