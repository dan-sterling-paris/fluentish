<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FluentISH CRM</title>

  <script>
    const SUPABASE_URL     = 'https://gutihncfxjdyxulfwtgp.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd1dGlobmNmeGpkeXh1bGZ3dGdwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc5MDQ1MTAsImV4cCI6MjA5MzQ4MDUxMH0.ZnWjJLSzoshYwszYC4FGS-ebhqyAKfe6Iag0AlUhPmI';
    const FUNCTION_BASE    = SUPABASE_URL + '/functions/v1';
  </script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      safelist: [
        'bg-gray-100','text-gray-600',
        'bg-blue-100','text-blue-700',
        'bg-yellow-100','text-yellow-700',
        'bg-purple-100','text-purple-700',
        'bg-green-100','text-green-700',
        'bg-red-100','text-red-500',
      ],
      theme: {
        extend: {
          colors: {
            navy:   '#003359',
            navyD:  '#002040',
            rouge:  '#C8102E',
            rougeH: '#A50D25',
            cyan:   '#4DD4F5',
            sand:   '#F7F4EF',
          },
          fontFamily: {
            display: ['"Playfair Display"', 'Georgia', 'serif'],
            body:    ['Inter', 'system-ui', 'sans-serif'],
          },
        },
      },
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script src="app.js"></script>
  <script defer src="https://unpkg.com/alpinejs@3.14.1/dist/cdn.min.js"></script>
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
    .chat-out { background:#003359; color:#fff; border-radius:18px 18px 4px 18px; }
    .chat-in  { background:#F7F4EF; color:#1a1a2e; border-radius:18px 18px 18px 4px; border:1px solid #e5e7eb; }
    #chat-messages { scroll-behavior: smooth; }
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 99px; }

    /* On desktop, always show both sidebar and main regardless of Alpine state */
    @media (min-width: 768px) {
      .crm-sidebar { display: flex !important; }
      .crm-main    { display: flex !important; }
    }
  </style>
</head>

<body class="h-full bg-sand flex flex-col overflow-hidden" x-data="crmApp()" x-init="init()">

  <!-- ── LOGIN SCREEN ───────────────────────────────────────────────────── -->
  <div
    x-show="!loggedIn"
    class="fixed inset-0 z-50 flex items-center justify-center bg-navy"
  >
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-sm mx-4 p-8 space-y-6">
      <div class="text-center">
        <p class="font-display text-3xl font-bold text-navy">Fluent<span class="text-rouge">ISH</span></p>
        <p class="text-sm text-gray-400 mt-1">CRM</p>
      </div>
      <div class="space-y-4">
        <input
          x-model="loginEmail"
          type="email"
          placeholder="Email"
          @keydown.enter="login()"
          class="w-full rounded-xl border border-gray-200 px-4 py-3 text-sm focus:outline-none focus:border-navy focus:ring-2 focus:ring-navy/20"
        />
        <input
          x-model="loginPassword"
          type="password"
          placeholder="Password"
          @keydown.enter="login()"
          class="w-full rounded-xl border border-gray-200 px-4 py-3 text-sm focus:outline-none focus:border-navy focus:ring-2 focus:ring-navy/20"
        />
        <p x-show="loginError" x-text="loginError" class="text-xs text-red-500 text-center"></p>
        <button
          @click="login()"
          :disabled="loginLoading"
          class="w-full bg-navy hover:bg-navyD disabled:opacity-50 text-white py-3 rounded-xl text-sm font-semibold transition-colors"
          x-text="loginLoading ? 'Signing in…' : 'Sign in'"
        ></button>
      </div>
    </div>
  </div>

  <!-- ── HEADER ──────────────────────────────────────────────────────────── -->
  <header class="bg-navy text-white px-4 py-3 flex items-center justify-between shrink-0 shadow-md z-10">
    <div class="flex items-center gap-3">
      <!-- Back button: mobile only, shown when viewing a lead or templates -->
      <button
        x-show="selectedLead || showTemplates"
        @click="closeLead(); showTemplates = false"
        class="md:hidden p-1 rounded hover:bg-white/10 transition-colors mr-1"
        aria-label="Back"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/>
        </svg>
      </button>
      <a href="https://fluentish.co.uk" target="_blank" class="font-display text-xl font-bold tracking-tight hover:opacity-80 transition-opacity">
        Fluent<span class="text-rouge">ISH</span>
      </a>
      <span class="text-blue-200 text-sm font-normal border-l border-blue-700 pl-3">CRM</span>
    </div>
    <div class="flex items-center gap-3">
      <button
        @click="openTemplates()"
        class="text-xs text-blue-200 hover:text-white transition-colors px-2 py-1 rounded hover:bg-white/10"
      >Templates</button>
      <button
        @click="logout()"
        class="text-xs text-blue-200 hover:text-white transition-colors px-2 py-1 rounded hover:bg-white/10"
      >Sign out</button>
      <span class="w-2 h-2 rounded-full transition-colors" :class="realtimeConnected ? 'bg-green-400' : 'bg-yellow-400 animate-pulse'"></span>
      <span class="text-xs text-blue-200" x-text="realtimeConnected ? 'Live' : 'Connecting…'"></span>
    </div>
  </header>

  <div class="flex flex-1 overflow-hidden">

    <!-- ── SIDEBAR ─────────────────────────────────────────────────────────
         Mobile: shown only when no lead/templates open (x-show handles it;
                 the !important media query forces it visible on desktop).
         Desktop: always visible via CSS !important above.
    ──────────────────────────────────────────────────────────────────────── -->
    <aside
      class="crm-sidebar flex flex-col w-full md:w-80 shrink-0 bg-white border-r border-gray-200"
      x-show="!selectedLead && !showTemplates"
    >
      <!-- Status filter tabs -->
      <div class="px-3 pt-3 pb-2 border-b border-gray-100">
        <div class="flex flex-wrap gap-1">
          <template x-for="s in statuses" :key="s.value">
            <button
              @click="filterStatus = s.value; loadLeads()"
              :class="filterStatus === s.value ? 'bg-navy text-white shadow-sm' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'"
              class="px-3 py-1 rounded-full text-xs font-semibold transition-colors whitespace-nowrap"
              x-text="s.label"
            ></button>
          </template>
        </div>
      </div>

      <!-- Lead count -->
      <div class="px-4 py-2 text-xs text-gray-400 border-b border-gray-50">
        <span x-text="leads.length"></span> lead<span x-show="leads.length !== 1">s</span>
      </div>

      <!-- Lead list -->
      <ul class="flex-1 overflow-y-auto divide-y divide-gray-50">
        <template x-for="lead in leads" :key="lead.id">
          <li
            @click="selectLead(lead)"
            :class="selectedLead?.id === lead.id ? 'bg-sand border-l-4 border-rouge' : 'border-l-4 border-transparent hover:bg-gray-50'"
            class="px-4 py-3 cursor-pointer transition-all"
          >
            <div class="flex items-start justify-between gap-2">
              <span class="font-semibold text-sm text-navy truncate" x-text="lead.name"></span>
              <div class="flex flex-col items-end shrink-0">
                <span :class="badgeClass(lead.status)" class="text-xs px-2 py-0.5 rounded-full font-semibold capitalize" x-text="lead.status.replace('_',' ')"></span>
                <span x-show="lead.last_message_at" class="text-xs text-gray-300 mt-0.5" x-text="formatAge(lead.last_message_at)"></span>
              </div>
            </div>
            <div class="flex items-center gap-2 mt-0.5">
              <p class="text-xs text-gray-400 truncate" x-text="lead.phone"></p>
              <span
                x-show="lead.last_message_direction === 'inbound' && (Date.now() - new Date(lead.last_message_at)) < 86400000"
                class="text-xs font-semibold text-green-600 bg-green-50 px-1.5 py-0.5 rounded shrink-0"
              >● Reply</span>
              <span
                x-show="lead.last_message_direction === 'inbound' && (Date.now() - new Date(lead.last_message_at)) >= 86400000"
                class="text-xs font-semibold text-yellow-600 bg-yellow-50 px-1.5 py-0.5 rounded shrink-0"
              >● Follow up</span>
            </div>
          </li>
        </template>
        <li x-show="leads.length === 0" class="px-4 py-10 text-center text-gray-400 text-sm">No leads yet</li>
      </ul>
    </aside>

    <!-- ── MAIN PANEL ──────────────────────────────────────────────────────
         Mobile: shown only when a lead or templates panel is open.
         Desktop: always visible via CSS !important above.
    ──────────────────────────────────────────────────────────────────────── -->
    <main
      class="crm-main flex flex-col flex-1 overflow-hidden bg-white"
      x-show="selectedLead || showTemplates"
    >

      <!-- ── TEMPLATE EDITOR ──────────────────────────────────────────── -->
      <template x-if="showTemplates">
        <div class="flex flex-col flex-1 overflow-hidden">
          <div class="px-6 py-4 border-b border-gray-100 bg-white shadow-sm shrink-0">
            <h2 class="font-semibold text-navy">SMS Templates</h2>
            <p class="text-xs text-gray-400 mt-0.5">Use <code class="bg-gray-100 px-1 rounded">{name}</code> for the lead's first name.</p>
          </div>
          <div class="flex-1 overflow-y-auto px-6 py-6 space-y-6">
            <template x-for="tmpl in templates" :key="tmpl.key">
              <div class="space-y-2">
                <label class="block text-sm font-semibold text-navy" x-text="templateLabel(tmpl.key)"></label>
                <textarea x-model="tmpl.body" rows="3" class="w-full rounded-xl border border-gray-200 px-4 py-2.5 text-sm resize-none focus:outline-none focus:border-navy focus:ring-2 focus:ring-navy/20 transition-all"></textarea>
                <button
                  @click="saveTemplate(tmpl)"
                  :disabled="savingTemplate === tmpl.key"
                  class="bg-navy hover:bg-navyD disabled:opacity-40 text-white px-4 py-1.5 rounded-lg text-sm font-semibold transition-colors"
                  x-text="savingTemplate === tmpl.key ? 'Saving…' : 'Save'"
                ></button>
              </div>
            </template>
          </div>
        </div>
      </template>

      <!-- ── EMPTY STATE (desktop only) ──────────────────────────────── -->
      <div x-show="!selectedLead && !showTemplates" class="flex-1 flex items-center justify-center">
        <div class="text-center space-y-2">
          <p class="font-display text-3xl text-navy/20">FluentISH CRM</p>
          <p class="text-sm text-gray-400">Select a lead from the left to start a conversation</p>
        </div>
      </div>

      <!-- ── CONVERSATION ──────────────────────────────────────────────── -->
      <template x-if="selectedLead">
        <div class="flex flex-col flex-1 overflow-hidden">

          <!-- Chat header -->
          <div class="px-4 md:px-6 py-4 border-b border-gray-100 flex items-center justify-between shrink-0 bg-white shadow-sm z-10">
            <div>
              <h2 class="font-semibold text-navy" x-text="selectedLead.name"></h2>
              <p class="text-xs text-gray-400 mt-0.5" x-text="selectedLead.phone"></p>
            </div>
            <div class="flex items-center gap-2">
              <select
                x-model="selectedLead.status"
                @change="updateStatus(selectedLead.id, selectedLead.status)"
                :class="badgeClass(selectedLead.status)"
                class="text-xs px-3 py-1 rounded-full font-semibold border-0 cursor-pointer focus:outline-none focus:ring-2 focus:ring-navy/30 capitalize"
              >
                <option value="new">New</option>
                <option value="contacted">Contacted</option>
                <option value="interested">Interested</option>
                <option value="call_booked">Call Booked</option>
                <option value="enrolled">Enrolled</option>
                <option value="lost">Lost</option>
              </select>
              <!-- Delete button -->
              <button
                @click="deleteLead(selectedLead.id)"
                class="p-1.5 rounded-lg text-gray-400 hover:text-red-500 hover:bg-red-50 transition-colors"
                title="Delete lead"
              >
                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                </svg>
              </button>
            </div>
          </div>

          <!-- Messages -->
          <div id="chat-messages" class="flex-1 overflow-y-auto px-4 md:px-6 py-4 space-y-3">
            <template x-for="msg in messages" :key="msg.id">
              <div :class="msg.direction === 'outbound' ? 'flex justify-end' : 'flex justify-start'">
                <div :class="msg.direction === 'outbound' ? 'chat-out' : 'chat-in'" class="max-w-xs lg:max-w-md xl:max-w-lg px-4 py-2.5 text-sm shadow-sm">
                  <p class="leading-relaxed" x-text="msg.body"></p>
                  <p class="text-xs mt-1.5 opacity-50 text-right" x-text="formatTime(msg.sent_at)"></p>
                </div>
              </div>
            </template>
            <div x-show="messages.length === 0" class="text-center text-gray-400 text-sm py-12">No messages yet</div>
          </div>

          <!-- Reply area -->
          <div class="border-t border-gray-100 p-3 md:p-4 space-y-3 bg-white shrink-0">
            <div class="flex items-center gap-2 flex-wrap">
              <span class="text-xs text-gray-400 font-medium">Templates:</span>
              <button @click="sendTemplate(2)" :disabled="sending" :title="config.template_2" class="text-xs bg-sand hover:bg-gray-200 disabled:opacity-40 text-navy px-3 py-1.5 rounded-full font-medium transition-colors border border-gray-200">Follow-up 1</button>
              <button @click="sendTemplate(3)" :disabled="sending" :title="config.template_3" class="text-xs bg-sand hover:bg-gray-200 disabled:opacity-40 text-navy px-3 py-1.5 rounded-full font-medium transition-colors border border-gray-200">Follow-up 2</button>
            </div>
            <div class="flex items-end gap-2">
              <textarea
                x-model="replyText"
                @keydown.meta.enter.prevent="sendReply()"
                @keydown.ctrl.enter.prevent="sendReply()"
                rows="2"
                placeholder="Type a message… (⌘+Enter to send)"
                class="flex-1 rounded-2xl border border-gray-200 px-4 py-2.5 text-sm resize-none focus:outline-none focus:border-navy focus:ring-2 focus:ring-navy/20 transition-all"
              ></textarea>
              <button
                @click="sendReply()"
                :disabled="!replyText.trim() || sending"
                class="bg-navy hover:bg-navyD disabled:opacity-40 text-white px-4 md:px-5 py-2.5 rounded-2xl text-sm font-semibold transition-colors self-end shrink-0"
              >
                <span x-show="!sending">Send</span>
                <span x-show="sending">…</span>
              </button>
            </div>
          </div>

        </div>
      </template>

    </main>

  </div>

</body>
</html>
