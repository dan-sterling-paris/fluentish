<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FluentISH CRM</title>

  <!-- ── Configure your Supabase project ──────────────────────────────────────
       Replace the two values below with your actual project credentials.
       Find them in: Supabase dashboard → Project Settings → API
  ─────────────────────────────────────────────────────────────────────────── -->
  <script>
    const SUPABASE_URL     = 'https://YOUR_PROJECT_REF.supabase.co';
    const SUPABASE_ANON_KEY = 'YOUR_ANON_KEY';
    const FUNCTION_BASE    = SUPABASE_URL + '/functions/v1';
  </script>

  <!-- Supabase JS (exposes window.supabase) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            navy:   '#003359',
            navyD:  '#002040',
            rouge:  '#C8102E',
            rougeH: '#A50D25',
            cyan:   '#4DD4F5',
            sand:   '#F7F4EF',
          },
          fontFamily: {
            display: ['"Playfair Display"', 'Georgia', 'serif'],
            body:    ['Inter', 'system-ui', 'sans-serif'],
          },
        },
      },
    }
  </script>
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700&family=Inter:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <script defer src="https://unpkg.com/alpinejs@3.14.1/dist/cdn.min.js"></script>
  <script src="app.js" defer></script>
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
    .chat-out {
      background: #003359;
      color: #fff;
      border-radius: 18px 18px 4px 18px;
    }
    .chat-in {
      background: #F7F4EF;
      color: #1a1a2e;
      border-radius: 18px 18px 18px 4px;
      border: 1px solid #e5e7eb;
    }
    #chat-messages { scroll-behavior: smooth; }
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 99px; }
  </style>
</head>

<body
  class="h-full bg-sand flex flex-col overflow-hidden"
  x-data="crmApp()"
  x-init="init()"
>

  <!-- Top nav -->
  <header class="bg-navy text-white px-6 py-3 flex items-center justify-between shrink-0 shadow-md z-10">
    <div class="flex items-center gap-3">
      <a href="https://fluentish.co.uk" target="_blank" class="font-display text-xl font-bold tracking-tight hover:opacity-80 transition-opacity">
        Fluent<span class="text-rouge">ISH</span>
      </a>
      <span class="text-blue-200 text-sm font-normal border-l border-blue-700 pl-3">CRM</span>
    </div>
    <div class="flex items-center gap-2">
      <span
        class="w-2 h-2 rounded-full transition-colors"
        :class="realtimeConnected ? 'bg-green-400' : 'bg-yellow-400 animate-pulse'"
      ></span>
      <span class="text-xs text-blue-200" x-text="realtimeConnected ? 'Live' : 'Connecting…'"></span>
    </div>
  </header>

  <div class="flex flex-1 overflow-hidden">

    <!-- ── LEFT SIDEBAR ───────────────────────────────────────────────────── -->
    <aside class="w-80 bg-white border-r border-gray-200 flex flex-col shrink-0">

      <!-- Status filter tabs -->
      <div class="px-3 pt-3 pb-2 border-b border-gray-100">
        <div class="flex flex-wrap gap-1">
          <template x-for="s in statuses" :key="s.value">
            <button
              @click="filterStatus = s.value; loadLeads()"
              :class="filterStatus === s.value
                ? 'bg-navy text-white shadow-sm'
                : 'bg-gray-100 text-gray-600 hover:bg-gray-200'"
              class="px-3 py-1 rounded-full text-xs font-semibold transition-colors whitespace-nowrap"
              x-text="s.label"
            ></button>
          </template>
        </div>
      </div>

      <!-- Lead count -->
      <div class="px-4 py-2 text-xs text-gray-400 border-b border-gray-50">
        <span x-text="leads.length"></span> lead<span x-show="leads.length !== 1">s</span>
      </div>

      <!-- Lead list -->
      <ul class="flex-1 overflow-y-auto divide-y divide-gray-50">
        <template x-for="lead in leads" :key="lead.id">
          <li
            @click="selectLead(lead)"
            :class="selectedLead?.id === lead.id
              ? 'bg-sand border-l-4 border-rouge'
              : 'border-l-4 border-transparent hover:bg-gray-50'"
            class="px-4 py-3 cursor-pointer transition-all"
          >
            <div class="flex items-start justify-between gap-2">
              <span class="font-semibold text-sm text-navy truncate" x-text="lead.name"></span>
              <span
                :class="badgeClass(lead.status)"
                class="text-xs px-2 py-0.5 rounded-full font-semibold shrink-0 capitalize"
                x-text="lead.status.replace('_', ' ')"
              ></span>
            </div>
            <p class="text-xs text-gray-400 mt-0.5 truncate" x-text="lead.phone"></p>
          </li>
        </template>
        <li
          x-show="leads.length === 0"
          class="px-4 py-10 text-center text-gray-400 text-sm"
        >
          No leads yet
        </li>
      </ul>
    </aside>

    <!-- ── RIGHT PANEL ────────────────────────────────────────────────────── -->
    <main class="flex-1 flex flex-col overflow-hidden bg-white">

      <!-- Empty state -->
      <div
        x-show="!selectedLead"
        class="flex-1 flex items-center justify-center"
      >
        <div class="text-center space-y-2">
          <p class="font-display text-3xl text-navy/20">FluentISH CRM</p>
          <p class="text-sm text-gray-400">Select a lead from the left to start a conversation</p>
        </div>
      </div>

      <!-- Conversation view -->
      <template x-if="selectedLead">
        <div class="flex flex-col flex-1 overflow-hidden">

          <!-- Chat header -->
          <div class="px-6 py-4 border-b border-gray-100 flex items-center justify-between shrink-0 bg-white shadow-sm z-10">
            <div>
              <h2 class="font-semibold text-navy" x-text="selectedLead.name"></h2>
              <p class="text-xs text-gray-400 mt-0.5" x-text="selectedLead.phone"></p>
            </div>
            <div class="flex items-center gap-3">
              <select
                x-model="selectedLead.status"
                @change="updateStatus(selectedLead.id, selectedLead.status)"
                :class="badgeClass(selectedLead.status)"
                class="text-xs px-3 py-1 rounded-full font-semibold border-0 cursor-pointer focus:outline-none focus:ring-2 focus:ring-navy/30 capitalize"
              >
                <option value="new">new</option>
                <option value="auto_contacted">auto contacted</option>
                <option value="replied">replied</option>
                <option value="booked">booked</option>
              </select>
            </div>
          </div>

          <!-- Message bubbles -->
          <div
            id="chat-messages"
            class="flex-1 overflow-y-auto px-6 py-4 space-y-3"
          >
            <template x-for="msg in messages" :key="msg.id">
              <div :class="msg.direction === 'outbound' ? 'flex justify-end' : 'flex justify-start'">
                <div
                  :class="msg.direction === 'outbound' ? 'chat-out' : 'chat-in'"
                  class="max-w-xs lg:max-w-md xl:max-w-lg px-4 py-2.5 text-sm shadow-sm"
                >
                  <p class="leading-relaxed" x-text="msg.body"></p>
                  <p
                    class="text-xs mt-1.5 opacity-50 text-right"
                    x-text="formatTime(msg.sent_at)"
                  ></p>
                </div>
              </div>
            </template>
            <div
              x-show="messages.length === 0"
              class="text-center text-gray-400 text-sm py-12"
            >
              No messages yet
            </div>
          </div>

          <!-- Reply area -->
          <div class="border-t border-gray-100 p-4 space-y-3 bg-white shrink-0">

            <!-- Template buttons -->
            <div class="flex items-center gap-2 flex-wrap">
              <span class="text-xs text-gray-400 font-medium">Templates:</span>
              <button
                @click="sendTemplate(2)"
                :disabled="sending"
                :title="config.template_2"
                class="text-xs bg-sand hover:bg-gray-200 disabled:opacity-40 text-navy px-3 py-1.5 rounded-full font-medium transition-colors border border-gray-200"
              >
                Follow-up 1
              </button>
              <button
                @click="sendTemplate(3)"
                :disabled="sending"
                :title="config.template_3"
                class="text-xs bg-sand hover:bg-gray-200 disabled:opacity-40 text-navy px-3 py-1.5 rounded-full font-medium transition-colors border border-gray-200"
              >
                Follow-up 2
              </button>
            </div>

            <!-- Free-text input -->
            <div class="flex items-end gap-2">
              <textarea
                x-model="replyText"
                @keydown.meta.enter.prevent="sendReply()"
                @keydown.ctrl.enter.prevent="sendReply()"
                rows="2"
                placeholder="Type a message… (Ctrl+Enter or ⌘+Enter to send)"
                class="flex-1 rounded-2xl border border-gray-200 px-4 py-2.5 text-sm resize-none focus:outline-none focus:border-navy focus:ring-2 focus:ring-navy/20 transition-all"
              ></textarea>
              <button
                @click="sendReply()"
                :disabled="!replyText.trim() || sending"
                class="bg-navy hover:bg-navyD disabled:opacity-40 text-white px-5 py-2.5 rounded-2xl text-sm font-semibold transition-colors self-end shrink-0"
              >
                <span x-show="!sending">Send</span>
                <span x-show="sending">…</span>
              </button>
            </div>
          </div>

        </div>
      </template>
    </main>

  </div><!-- end flex -->

</body>
</html>
