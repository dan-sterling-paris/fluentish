<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>FluentISH Ads</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0d0d0d;
  --surface: #1a1a1a;
  --border: #2a2a2a;
  --text: #f0f0f0;
  --muted: #777;
  --green: #22c55e;
  --blue: #3b82f6;
  --amber: #f59e0b;
  --purple: #a855f7;
  --accent: #6366f1;
  --red: #ef4444;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  font-size: 15px;
  min-height: 100dvh;
  padding: 16px 16px 32px;
}

/* --- Login --- */
#login {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 80dvh;
  gap: 12px;
  text-align: center;
}
#login h1 { font-size: 22px; font-weight: 700; }
#login h1 span { color: var(--accent); }
#login p { color: var(--muted); font-size: 14px; }
#pin-input {
  width: 100%;
  max-width: 320px;
  padding: 12px 16px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  font-size: 16px;
  font-family: monospace;
  text-align: center;
  outline: none;
}
#pin-input:focus { border-color: var(--accent); }
#login-btn {
  width: 100%;
  max-width: 320px;
  padding: 12px;
  border-radius: 10px;
  background: var(--accent);
  color: #fff;
  font-size: 15px;
  font-weight: 600;
  border: none;
  cursor: pointer;
  font-family: inherit;
}
#login-btn:active { opacity: 0.85; }
#login-err { color: var(--red); font-size: 13px; min-height: 18px; }

/* --- Dashboard --- */
#app { display: none; }

header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 18px;
  gap: 10px;
  flex-wrap: wrap;
}
.logo { font-size: 17px; font-weight: 700; letter-spacing: -0.4px; }
.logo span { color: var(--accent); }

.range-pills { display: flex; gap: 6px; }
.pill {
  padding: 5px 13px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--muted);
  font-size: 13px;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.12s;
}
.pill.active, .pill:hover { background: var(--accent); border-color: var(--accent); color: #fff; }

.grid-4 {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  margin-bottom: 10px;
}
@media (min-width: 600px) { .grid-4 { grid-template-columns: repeat(4, 1fr); } }

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px 16px;
}
.card-label {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.09em;
  color: var(--muted);
  margin-bottom: 5px;
}
.card-value { font-size: 24px; font-weight: 700; letter-spacing: -0.5px; line-height: 1; }
.card-sub { font-size: 11px; color: var(--muted); margin-top: 4px; }

.c-spend  .card-value { color: var(--green); }
.c-impr   .card-value { color: var(--blue); }
.c-clicks .card-value { color: var(--amber); }
.c-book   .card-value { color: var(--purple); }

.section-title {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.09em;
  color: var(--muted);
  margin: 18px 0 8px;
}

.table-wrap {
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--surface);
}
table { width: 100%; border-collapse: collapse; font-size: 13px; white-space: nowrap; }
th {
  text-align: right;
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.07em;
  color: var(--muted);
  padding: 10px 12px;
  border-bottom: 1px solid var(--border);
}
th:first-child { text-align: left; }
td {
  text-align: right;
  padding: 8px 12px;
  border-bottom: 1px solid var(--border);
}
td:first-child { text-align: left; color: var(--muted); }
tr:last-child td { border-bottom: none; }
tr:hover td { background: rgba(255,255,255,0.025); }

.tag-book {
  display: inline-block;
  background: rgba(168,85,247,0.18);
  color: var(--purple);
  border-radius: 4px;
  padding: 1px 7px;
  font-weight: 600;
}

.state { text-align: center; padding: 40px 16px; color: var(--muted); }
.spinner {
  width: 26px; height: 26px;
  border: 2px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
  margin: 0 auto 10px;
}
@keyframes spin { to { transform: rotate(360deg); } }

footer { text-align: center; font-size: 11px; color: var(--muted); margin-top: 20px; }
</style>
</head>
<body>

<!-- Login screen -->
<div id="login">
  <div>
    <h1>Fluent<span>ISH</span> Ads</h1>
    <p>Enter your dashboard token to continue</p>
  </div>
  <input id="pin-input" type="password" placeholder="Token" autocomplete="off" spellcheck="false">
  <button id="login-btn">View Dashboard</button>
  <div id="login-err"></div>
</div>

<!-- Dashboard -->
<div id="app">
  <header>
    <div class="logo">Fluent<span>ISH</span> Ads</div>
    <div class="range-pills">
      <button class="pill" data-days="7">7d</button>
      <button class="pill active" data-days="14">14d</button>
      <button class="pill" data-days="28">28d</button>
    </div>
  </header>

  <div id="summary-cards" class="grid-4">
    <div class="state" style="grid-column:1/-1"><div class="spinner"></div>Loading&hellip;</div>
  </div>
  <div id="ratio-cards" class="grid-4" style="display:none"></div>

  <div id="table-section" style="display:none">
    <div class="section-title">Daily breakdown</div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>Spend</th>
            <th>Impr</th>
            <th>Reach</th>
            <th>Clicks</th>
            <th>Bookings</th>
            <th>CTR</th>
            <th>CPC</th>
            <th>CPM</th>
            <th>Cost/Bkg</th>
          </tr>
        </thead>
        <tbody id="daily-body"></tbody>
      </table>
    </div>
  </div>

  <footer id="footer"></footer>
</div>

<script>
(function () {
  var API = 'https://gutihncfxjdyxulfwtgp.supabase.co/functions/v1/dashboard';
  var SESSION_KEY = 'ads_token';
  var token = sessionStorage.getItem(SESSION_KEY) || '';
  var days = 14;

  // --- Helpers ---
  function fmt(n, dec, prefix) {
    if (n == null || isNaN(n) || n === '') return '-';
    var s = Number(n).toFixed(dec != null ? dec : 0);
    var parts = s.split('.');
    parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    return (prefix || '') + parts.join('.');
  }

  function schedules(row) {
    var a = (row.actions || []).find(function (x) { return x.action_type === 'schedule'; });
    return a ? parseInt(a.value, 10) : 0;
  }

  function fmtDate(str) {
    var d = new Date(str + 'T12:00:00Z');
    return d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
  }

  function card(cls, label, value, sub) {
    return '<div class="card ' + cls + '">' +
      '<div class="card-label">' + label + '</div>' +
      '<div class="card-value">' + value + '</div>' +
      '<div class="card-sub">' + sub + '</div></div>';
  }

  // --- Login ---
  var loginEl = document.getElementById('login');
  var appEl = document.getElementById('app');
  var pinInput = document.getElementById('pin-input');
  var loginBtn = document.getElementById('login-btn');
  var loginErr = document.getElementById('login-err');

  function tryLogin() {
    var val = pinInput.value.trim();
    if (!val) return;
    loginBtn.textContent = 'Checking\u2026';
    loginBtn.disabled = true;
    loginErr.textContent = '';

    fetch(API + '?t=' + encodeURIComponent(val) + '&days=7')
      .then(function (r) { return r.json(); })
      .then(function (json) {
        if (json.ok) {
          token = val;
          sessionStorage.setItem(SESSION_KEY, token);
          loginEl.style.display = 'none';
          appEl.style.display = '';
          load();
        } else {
          loginErr.textContent = 'Invalid token';
          loginBtn.textContent = 'View Dashboard';
          loginBtn.disabled = false;
        }
      })
      .catch(function () {
        loginErr.textContent = 'Connection error';
        loginBtn.textContent = 'View Dashboard';
        loginBtn.disabled = false;
      });
  }

  loginBtn.addEventListener('click', tryLogin);
  pinInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') tryLogin(); });

  // If token already in session, skip login
  if (token) {
    loginEl.style.display = 'none';
    appEl.style.display = '';
  }

  // --- Data loading ---
  function load() {
    document.getElementById('summary-cards').innerHTML =
      '<div class="state" style="grid-column:1/-1"><div class="spinner"></div>Loading\u2026</div>';
    document.getElementById('ratio-cards').style.display = 'none';
    document.getElementById('table-section').style.display = 'none';
    document.getElementById('footer').textContent = '';

    fetch(API + '?t=' + encodeURIComponent(token) + '&days=' + days)
      .then(function (r) { return r.json(); })
      .then(function (json) {
        if (!json.ok) throw new Error(json.error || 'Error');
        render(json.rows, json.account);
      })
      .catch(function (e) {
        document.getElementById('summary-cards').innerHTML =
          '<div class="state" style="color:#ef4444;grid-column:1/-1">Failed: ' + e.message + '</div>';
      });
  }

  // --- Render ---
  function render(rows, accountName) {
    rows.sort(function (a, b) { return a.date_start < b.date_start ? -1 : 1; });

    var totSpend = 0, totImpr = 0, totReach = 0, totClicks = 0, totBook = 0;
    rows.forEach(function (r) {
      totSpend  += parseFloat(r.spend || 0);
      totImpr   += parseInt(r.impressions || 0, 10);
      totReach  += parseInt(r.reach || 0, 10);
      totClicks += parseInt(r.clicks || 0, 10);
      totBook   += schedules(r);
    });

    var totCPM = totImpr  ? totSpend / totImpr * 1000 : 0;
    var totCPC = totClicks ? totSpend / totClicks : 0;
    var totCTR = totImpr  ? totClicks / totImpr * 100 : 0;

    document.getElementById('summary-cards').innerHTML =
      card('c-spend',  'Spend',       '\u00a3' + fmt(totSpend, 2), days + 'd total') +
      card('c-impr',   'Impressions',  fmt(totImpr),               days + 'd total') +
      card('c-clicks', 'Clicks',       fmt(totClicks),             days + 'd total') +
      card('c-book',   'Bookings',     totBook || '0',             'appointments');

    var rc = document.getElementById('ratio-cards');
    rc.style.display = '';
    rc.innerHTML =
      card('c-cpm',  'CPM',            '\u00a3' + fmt(totCPM, 2),  'per 1,000 impr') +
      card('c-cpc',  'CPC',            '\u00a3' + fmt(totCPC, 2),  'per click') +
      card('c-ctr',  'CTR',             fmt(totCTR, 2) + '%',      'click-through') +
      card('c-book', 'Cost / Booking',  totBook ? '\u00a3' + fmt(totSpend / totBook, 2) : '-', 'avg cost');

    var tbody = document.getElementById('daily-body');
    tbody.innerHTML = rows.slice().reverse().map(function (r) {
      var sp = parseFloat(r.spend || 0);
      var im = parseInt(r.impressions || 0, 10);
      var re = parseInt(r.reach || 0, 10);
      var cl = parseInt(r.clicks || 0, 10);
      var bk = schedules(r);
      return '<tr>' +
        '<td>' + fmtDate(r.date_start) + '</td>' +
        '<td>\u00a3' + fmt(sp, 2) + '</td>' +
        '<td>' + fmt(im) + '</td>' +
        '<td>' + fmt(re) + '</td>' +
        '<td>' + fmt(cl) + '</td>' +
        '<td>' + (bk ? '<span class="tag-book">' + bk + '</span>' : '-') + '</td>' +
        '<td>' + fmt(im ? cl / im * 100 : 0, 2) + '%</td>' +
        '<td>\u00a3' + fmt(cl ? sp / cl : 0, 2) + '</td>' +
        '<td>\u00a3' + fmt(im ? sp / im * 1000 : 0, 2) + '</td>' +
        '<td>' + (bk ? '\u00a3' + fmt(sp / bk, 2) : '-') + '</td>' +
        '</tr>';
    }).join('');

    document.getElementById('table-section').style.display = '';

    var now = new Date();
    document.getElementById('footer').textContent =
      (accountName ? accountName + ' \u00b7 ' : '') +
      'Updated ' + now.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }) +
      ' \u00b7 ' + now.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
  }

  // --- Range pills ---
  document.querySelectorAll('.pill').forEach(function (btn) {
    btn.addEventListener('click', function () {
      document.querySelectorAll('.pill').forEach(function (b) { b.classList.remove('active'); });
      btn.classList.add('active');
      days = parseInt(btn.dataset.days, 10);
      load();
    });
  });

  // Auto-load if already logged in
  if (token) load();
})();
</script>
</body>
</html>
