<!DOCTYPE html>
<html lang="en" style="color-scheme:dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex, nofollow">
<title>FluentISH Ads</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #0d0d0d !important;
  color: #f0f0f0 !important;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  font-size: 15px;
  min-height: 100vh;
  padding: 16px 16px 32px;
}

/* --- Login --- */
#login {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 80vh;
  gap: 12px;
  text-align: center;
}
#login h1 { font-size: 22px; font-weight: 700; color: #f0f0f0; }
#login h1 span { color: #6366f1; }
#login p { color: #888; font-size: 14px; }

#pin-input {
  width: 100%;
  max-width: 320px;
  padding: 12px 16px;
  border-radius: 10px;
  border: 1px solid #2a2a2a;
  background: #1a1a1a;
  color: #f0f0f0;
  font-size: 16px;
  font-family: monospace;
  text-align: center;
  outline: none;
  -webkit-appearance: none;
}
#pin-input:focus { border-color: #6366f1; }

#login-btn {
  width: 100%;
  max-width: 320px;
  padding: 12px;
  border-radius: 10px;
  background: #6366f1;
  color: #fff;
  font-size: 15px;
  font-weight: 600;
  border: none;
  cursor: pointer;
  font-family: inherit;
}
#login-err { color: #ef4444; font-size: 13px; min-height: 18px; }

/* --- App --- */
#app { display: none; }

header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 18px;
  gap: 10px;
  flex-wrap: wrap;
}
.logo { font-size: 17px; font-weight: 700; color: #f0f0f0; }
.logo span { color: #6366f1; }

.range-pills { display: flex; gap: 6px; }
.pill {
  padding: 5px 13px;
  border-radius: 999px;
  border: 1px solid #2a2a2a;
  background: transparent;
  color: #777;
  font-size: 13px;
  cursor: pointer;
  font-family: inherit;
}
.pill.active { background: #6366f1; border-color: #6366f1; color: #fff; }

.grid-4 {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  margin-bottom: 10px;
}
@media (min-width: 600px) { .grid-4 { grid-template-columns: repeat(4, 1fr); } }

.card {
  background: #1a1a1a;
  border: 1px solid #2a2a2a;
  border-radius: 12px;
  padding: 14px 16px;
}
.card-label {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.09em;
  color: #666;
  margin-bottom: 5px;
}
.card-value { font-size: 24px; font-weight: 700; letter-spacing: -0.5px; line-height: 1; }
.card-sub { font-size: 11px; color: #666; margin-top: 4px; }

.c-spend  .card-value { color: #22c55e; }
.c-impr   .card-value { color: #3b82f6; }
.c-clicks .card-value { color: #f59e0b; }
.c-book   .card-value { color: #a855f7; }
.c-cpm    .card-value, .c-cpc .card-value, .c-ctr .card-value { color: #f0f0f0; }

.section-title {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.09em;
  color: #666;
  margin: 18px 0 8px;
}

.table-wrap {
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  border: 1px solid #2a2a2a;
  border-radius: 12px;
  background: #1a1a1a;
}
table { width: 100%; border-collapse: collapse; font-size: 13px; white-space: nowrap; }
th {
  text-align: right;
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.07em;
  color: #666;
  padding: 10px 12px;
  border-bottom: 1px solid #2a2a2a;
}
th:first-child { text-align: left; }
td {
  text-align: right;
  padding: 8px 12px;
  border-bottom: 1px solid #222;
  color: #f0f0f0;
}
td:first-child { text-align: left; color: #888; }
tr:last-child td { border-bottom: none; }

.tag-book {
  display: inline-block;
  background: rgba(168,85,247,0.2);
  color: #a855f7;
  border-radius: 4px;
  padding: 1px 7px;
  font-weight: 600;
}

.state { text-align: center; padding: 40px 16px; color: #666; }
.spinner {
  width: 26px; height: 26px;
  border: 2px solid #2a2a2a;
  border-top-color: #6366f1;
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
  margin: 0 auto 10px;
}
@keyframes spin { to { transform: rotate(360deg); } }

footer { text-align: center; font-size: 11px; color: #555; margin-top: 20px; }
</style>
</head>
<body>

<div id="login">
  <div>
    <h1>Fluent<span>ISH</span> Ads</h1>
    <p>Enter your dashboard token to continue</p>
  </div>
  <input id="pin-input" type="password" placeholder="Token" autocomplete="off" spellcheck="false">
  <button id="login-btn">View Dashboard</button>
  <div id="login-err"></div>
</div>

<div id="app">
  <header>
    <div class="logo">Fluent<span>ISH</span> Ads</div>
    <div class="range-pills">
      <button class="pill" data-days="7">7d</button>
      <button class="pill active" data-days="14">14d</button>
      <button class="pill" data-days="28">28d</button>
    </div>
  </header>

  <div id="summary-cards" class="grid-4"></div>
  <div id="ratio-cards" class="grid-4" style="display:none"></div>

  <div id="table-section" style="display:none">
    <div class="section-title">Daily breakdown</div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>Spend</th>
            <th>Impr</th>
            <th>Reach</th>
            <th>Clicks</th>
            <th>Bookings</th>
            <th>CTR</th>
            <th>CPC</th>
            <th>CPM</th>
            <th>Cost/Bkg</th>
          </tr>
        </thead>
        <tbody id="daily-body"></tbody>
      </table>
    </div>
  </div>

  <footer id="footer"></footer>
</div>

<script>
(function () {
  var API = 'https://gutihncfxjdyxulfwtgp.supabase.co/functions/v1/dashboard';
  var SESSION_KEY = 'ads_token';
  var token = '';
  var days = 14;

  try { token = sessionStorage.getItem(SESSION_KEY) || ''; } catch(e) {}

  // --- Helpers ---
  function fmt(n, dec, prefix) {
    if (n == null || isNaN(n) || n === '') return '-';
    var s = Number(n).toFixed(dec != null ? dec : 0);
    var parts = s.split('.');
    parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    return (prefix || '') + parts.join('.');
  }

  function schedules(row) {
    var acts = row.actions || [];
    // 'schedule' for standard Schedule pixel; 'offsite_conversion.fb_pixel_custom' for custom events
    var a = acts.find(function(x) {
      return x.action_type === 'schedule' || x.action_type === 'offsite_conversion.fb_pixel_custom';
    });
    return a ? parseInt(a.value, 10) : 0;
  }

  function fmtDate(str) {
    var d = new Date(str + 'T12:00:00Z');
    return d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
  }

  function card(cls, label, value, sub) {
    return '<div class="card ' + cls + '"><div class="card-label">' + label +
      '</div><div class="card-value">' + value +
      '</div><div class="card-sub">' + sub + '</div></div>';
  }

  function spinner() {
    return '<div class="state" style="grid-column:1/-1"><div class="spinner"></div>Loading\u2026</div>';
  }

  // --- Elements ---
  var loginEl  = document.getElementById('login');
  var appEl    = document.getElementById('app');
  var pinInput = document.getElementById('pin-input');
  var loginBtn = document.getElementById('login-btn');
  var loginErr = document.getElementById('login-err');

  // --- Login ---
  function tryLogin() {
    var val = pinInput.value.trim();
    if (!val) { loginErr.textContent = 'Please enter a token'; return; }
    loginBtn.textContent = 'Checking\u2026';
    loginBtn.disabled = true;
    loginErr.textContent = '';

    fetch(API + '?t=' + encodeURIComponent(val) + '&days=7')
      .then(function(r) { return r.json(); })
      .then(function(json) {
        if (json.ok) {
          token = val;
          try { sessionStorage.setItem(SESSION_KEY, token); } catch(e) {}
          loginEl.style.display = 'none';
          appEl.style.display = '';
          load();
        } else {
          loginErr.textContent = 'Invalid token';
          loginBtn.textContent = 'View Dashboard';
          loginBtn.disabled = false;
        }
      })
      .catch(function(e) {
        loginErr.textContent = 'Connection error: ' + e.message;
        loginBtn.textContent = 'View Dashboard';
        loginBtn.disabled = false;
      });
  }

  loginBtn.addEventListener('click', tryLogin);
  pinInput.addEventListener('keydown', function(e) { if (e.key === 'Enter') tryLogin(); });

  // Skip login if token cached
  if (token) {
    loginEl.style.display = 'none';
    appEl.style.display = '';
    load();
  }

  // --- Load data ---
  function load() {
    document.getElementById('summary-cards').innerHTML = spinner();
    document.getElementById('ratio-cards').style.display = 'none';
    document.getElementById('table-section').style.display = 'none';
    document.getElementById('footer').textContent = '';

    fetch(API + '?t=' + encodeURIComponent(token) + '&days=' + days)
      .then(function(r) { return r.json(); })
      .then(function(json) {
        if (!json.ok) throw new Error(json.error || 'Error');
        render(json.rows, json.account);
      })
      .catch(function(e) {
        document.getElementById('summary-cards').innerHTML =
          '<div class="state" style="color:#ef4444;grid-column:1/-1">Error: ' + e.message + '</div>';
      });
  }

  // --- Render ---
  function render(rows, accountName) {
    rows.sort(function(a, b) { return a.date_start < b.date_start ? -1 : 1; });

    var totSpend = 0, totImpr = 0, totReach = 0, totClicks = 0, totBook = 0;
    rows.forEach(function(r) {
      totSpend  += parseFloat(r.spend   || 0);
      totImpr   += parseInt(r.impressions || 0, 10);
      totReach  += parseInt(r.reach     || 0, 10);
      totClicks += parseInt(r.clicks    || 0, 10);
      totBook   += schedules(r);
    });

    var totCPM = totImpr   ? totSpend / totImpr * 1000 : 0;
    var totCPC = totClicks ? totSpend / totClicks       : 0;
    var totCTR = totImpr   ? totClicks / totImpr * 100  : 0;

    document.getElementById('summary-cards').innerHTML =
      card('c-spend',  'Spend',       '\u00a3' + fmt(totSpend, 2), days + 'd total') +
      card('c-impr',   'Impressions',  fmt(totImpr),               days + 'd total') +
      card('c-clicks', 'Clicks',       fmt(totClicks),             days + 'd total') +
      card('c-book',   'Bookings',     String(totBook),            'appointments');

    var rc = document.getElementById('ratio-cards');
    rc.innerHTML =
      card('c-cpm', 'CPM',            '\u00a3' + fmt(totCPM, 2),  'per 1,000 impr') +
      card('c-cpc', 'CPC',            '\u00a3' + fmt(totCPC, 2),  'per click') +
      card('c-ctr', 'CTR',             fmt(totCTR, 2) + '%',      'click-through') +
      card('c-book','Cost / Booking',  totBook ? '\u00a3' + fmt(totSpend / totBook, 2) : '-', 'avg cost');
    rc.style.display = '';

    var tbody = document.getElementById('daily-body');
    tbody.innerHTML = rows.slice().reverse().map(function(r) {
      var sp = parseFloat(r.spend || 0);
      var im = parseInt(r.impressions || 0, 10);
      var re = parseInt(r.reach || 0, 10);
      var cl = parseInt(r.clicks || 0, 10);
      var bk = schedules(r);
      return '<tr>' +
        '<td>' + fmtDate(r.date_start) + '</td>' +
        '<td>\u00a3' + fmt(sp, 2) + '</td>' +
        '<td>' + fmt(im) + '</td>' +
        '<td>' + fmt(re) + '</td>' +
        '<td>' + fmt(cl) + '</td>' +
        '<td>' + (bk ? '<span class="tag-book">' + bk + '</span>' : '-') + '</td>' +
        '<td>' + fmt(im ? cl / im * 100 : 0, 2) + '%</td>' +
        '<td>\u00a3' + fmt(cl ? sp / cl : 0, 2) + '</td>' +
        '<td>\u00a3' + fmt(im ? sp / im * 1000 : 0, 2) + '</td>' +
        '<td>' + (bk ? '\u00a3' + fmt(sp / bk, 2) : '-') + '</td>' +
        '</tr>';
    }).join('');

    document.getElementById('table-section').style.display = '';

    var now = new Date();
    document.getElementById('footer').textContent =
      'Updated ' + now.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }) +
      ' \u00b7 ' + now.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
  }

  // --- Range pills ---
  document.querySelectorAll('.pill').forEach(function(btn) {
    btn.addEventListener('click', function() {
      document.querySelectorAll('.pill').forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');
      days = parseInt(btn.dataset.days, 10);
      load();
    });
  });
})();
</script>
</body>
</html>
