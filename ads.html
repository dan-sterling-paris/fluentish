<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>FluentISH Ads</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { accent: '#6366f1' },
          fontFamily: { body: ['Inter', 'system-ui', 'sans-serif'] },
        },
      },
    }
  </script>
</head>
<body class="bg-white text-gray-900 font-body min-h-screen">

  <!-- Login -->
  <div id="login" class="flex flex-col items-center justify-center min-h-screen gap-4 px-6 text-center">
    <h1 class="text-2xl font-bold">Fluent<span class="text-accent">ISH</span> Ads</h1>
    <p class="text-gray-500 text-sm">Enter your dashboard token</p>
    <input id="pin" type="password" placeholder="Token" autocomplete="off"
      class="w-full max-w-xs px-4 py-3 rounded-xl border border-gray-300 bg-gray-50 text-center text-base font-mono focus:outline-none focus:border-accent" />
    <button id="go" class="w-full max-w-xs py-3 rounded-xl bg-accent text-white font-semibold text-sm">View Dashboard</button>
    <p id="err" class="text-red-500 text-xs h-5"></p>
  </div>

  <!-- Dashboard -->
  <div id="app" class="hidden px-4 py-5 max-w-4xl mx-auto">
    <!-- Header -->
    <div class="flex items-center justify-between flex-wrap gap-3 mb-4">
      <h1 class="text-lg font-bold">Fluent<span class="text-accent">ISH</span> Ads</h1>
      <div id="pills" class="flex gap-1.5">
        <button data-d="0"  class="pill px-3 py-1 rounded-full border text-xs font-medium bg-accent border-accent text-white">Today</button>
        <button data-d="7"  class="pill px-3 py-1 rounded-full border text-xs font-medium border-gray-300 text-gray-500">7d</button>
        <button data-d="14" class="pill px-3 py-1 rounded-full border text-xs font-medium border-gray-300 text-gray-500">14d</button>
        <button data-d="28" class="pill px-3 py-1 rounded-full border text-xs font-medium border-gray-300 text-gray-500">28d</button>
      </div>
    </div>

    <!-- Toggles -->
    <div class="flex items-center gap-3 mb-5 text-xs">
      <label class="flex items-center gap-1.5 cursor-pointer select-none">
        <input type="checkbox" id="cmp" class="accent-accent w-3.5 h-3.5" checked />
        <span class="text-gray-600">Compare prev period</span>
      </label>
      <label class="flex items-center gap-1.5 cursor-pointer select-none">
        <input type="checkbox" id="smooth" class="accent-accent w-3.5 h-3.5" />
        <span class="text-gray-600">3-day avg</span>
      </label>
    </div>

    <div id="cards" class="grid grid-cols-2 sm:grid-cols-4 gap-2.5 mb-2.5"></div>
    <div id="ratios" class="grid grid-cols-2 sm:grid-cols-4 gap-2.5 mb-5 hidden"></div>

    <!-- Waterfall charts -->
    <div id="waterfall" class="hidden mb-5">
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <p class="text-[10px] font-bold uppercase tracking-wide text-gray-400 mb-2">Spend bridge</p>
          <div class="overflow-x-auto bg-gray-50 border border-gray-200 rounded-xl p-3">
            <canvas id="wfSpend" height="200"></canvas>
          </div>
        </div>
        <div>
          <p class="text-[10px] font-bold uppercase tracking-wide text-gray-400 mb-2">Bookings funnel bridge</p>
          <div class="overflow-x-auto bg-gray-50 border border-gray-200 rounded-xl p-3">
            <canvas id="wfBook" height="200"></canvas>
          </div>
        </div>
      </div>
    </div>

    <div id="tbl" class="hidden">
      <div class="flex items-center justify-between mb-2">
        <p id="tbl-title" class="text-[10px] font-bold uppercase tracking-wide text-gray-400">Daily breakdown</p>
        <button id="csv-btn" class="text-[11px] font-medium text-accent hover:underline cursor-pointer">Download CSV</button>
      </div>
      <div class="overflow-x-auto rounded-xl border border-gray-200">
        <table class="w-full text-[13px] whitespace-nowrap">
          <thead>
            <tr class="text-[10px] uppercase tracking-wide text-gray-400">
              <th class="text-left px-3 py-2.5 border-b border-gray-200 font-bold">Date</th>
              <th class="text-right px-3 py-2.5 border-b border-gray-200 font-bold">Spend</th>
              <th class="text-right px-3 py-2.5 border-b border-gray-200 font-bold">Impr</th>
              <th class="text-right px-3 py-2.5 border-b border-gray-200 font-bold">Reach</th>
              <th class="text-right px-3 py-2.5 border-b border-gray-200 font-bold">Clicks</th>
              <th class="text-right px-3 py-2.5 border-b border-gray-200 font-bold">Bkgs</th>
              <th class="text-right px-3 py-2.5 border-b border-gray-200 font-bold">CTR</th>
              <th class="text-right px-3 py-2.5 border-b border-gray-200 font-bold">CPC</th>
              <th class="text-right px-3 py-2.5 border-b border-gray-200 font-bold">CPM</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </div>

    <p id="foot" class="text-center text-[11px] text-gray-400 mt-5"></p>
  </div>

  <script>
    var API = 'https://gutihncfxjdyxulfwtgp.supabase.co/functions/v1/dashboard';
    var tk = '', allRows = [], days = 0;
    try { tk = localStorage.getItem('ads_t') || ''; } catch(e) {}

    var loginEl = document.getElementById('login');
    var appEl = document.getElementById('app');
    var cmpBox = document.getElementById('cmp');
    var smoothBox = document.getElementById('smooth');

    // --- Helpers ---
    function fmt(n, d, p) {
      if (n == null || isNaN(n)) return '-';
      var s = Number(n).toFixed(d||0), pts = s.split('.');
      pts[0] = pts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
      return (p||'') + pts.join('.');
    }

    function bk(r) {
      var a = (r.actions||[]).find(function(x){
        return x.action_type==='offsite_conversion.fb_pixel_custom'||x.action_type==='schedule';
      });
      return a ? +a.value : 0;
    }

    function fd(s) {
      return new Date(s+'T12:00:00Z').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
    }

    function todayStr() { return new Date().toISOString().slice(0,10); }

    function crd(cls, lbl, val, sub) {
      return '<div class="bg-gray-50 border border-gray-200 rounded-xl p-3.5">' +
        '<p class="text-[10px] font-bold uppercase tracking-wide text-gray-400 mb-1">' + lbl + '</p>' +
        '<p class="text-2xl font-bold tracking-tight ' + cls + '">' + val + '</p>' +
        '<p class="text-[11px] text-gray-400 mt-1">' + sub + '</p></div>';
    }

    function crdD(cls, lbl, val, sub, dh) {
      return '<div class="bg-gray-50 border border-gray-200 rounded-xl p-3.5">' +
        '<p class="text-[10px] font-bold uppercase tracking-wide text-gray-400 mb-1">' + lbl + '</p>' +
        '<p class="text-2xl font-bold tracking-tight ' + cls + '">' + val + (dh||'') + '</p>' +
        '<p class="text-[11px] text-gray-400 mt-1">' + sub + '</p></div>';
    }

    function dUp(cur, prev) {
      if (!prev) return '';
      var pct = (cur - prev) / prev * 100;
      if (Math.abs(pct) < 0.5) return '<span class="text-gray-400 text-xs ml-1">0%</span>';
      var col = pct > 0 ? 'text-green-600' : 'text-red-500';
      return '<span class="'+col+' text-xs ml-1">'+(pct>0?'\u2191':'\u2193')+Math.abs(pct).toFixed(0)+'%</span>';
    }

    function dDown(cur, prev) {
      if (!prev) return '';
      var pct = (cur - prev) / prev * 100;
      if (Math.abs(pct) < 0.5) return '<span class="text-gray-400 text-xs ml-1">0%</span>';
      var col = pct < 0 ? 'text-green-600' : 'text-red-500';
      return '<span class="'+col+' text-xs ml-1">'+(pct>0?'\u2191':'\u2193')+Math.abs(pct).toFixed(0)+'%</span>';
    }

    // --- Slicing ---
    function slicePeriod(rows, numDays) {
      // rows sorted ascending by date. Slice the last numDays.
      if (numDays === 0) {
        // "Today" = just today's row
        var today = todayStr();
        var todayRow = rows.filter(function(r){ return r.date_start === today; });
        // If today not available yet, use the latest row
        return todayRow.length ? todayRow : rows.slice(-1);
      }
      return rows.slice(-numDays);
    }

    function slicePrev(rows, numDays) {
      // The period of equal length immediately before the current period
      if (numDays === 0) {
        // Compare today vs yesterday
        var today = todayStr();
        var idx = -1;
        for (var i = rows.length - 1; i >= 0; i--) {
          if (rows[i].date_start === today) { idx = i; break; }
        }
        if (idx < 1) {
          // Today not found, latest vs one before
          return rows.length >= 2 ? [rows[rows.length-2]] : [];
        }
        return idx >= 1 ? [rows[idx-1]] : [];
      }
      var end = rows.length - numDays;
      var start = end - numDays;
      if (start < 0) start = 0;
      return rows.slice(start, end);
    }

    function sumRows(arr) {
      var s=0,i=0,r=0,c=0,b=0;
      arr.forEach(function(x){
        s+=+(x.spend||0); i+=+(x.impressions||0); r+=+(x.reach||0); c+=+(x.clicks||0); b+=bk(x);
      });
      return {spend:s, impr:i, reach:r, clicks:c, bkgs:b};
    }

    // --- Rolling average ---
    function rollingAvg(rows, window) {
      return rows.map(function(r, idx) {
        var start = Math.max(0, idx - window + 1);
        var slice = rows.slice(start, idx + 1);
        var n = slice.length;
        var avg = {
          date_start: r.date_start,
          spend: String(slice.reduce(function(a,x){return a+ +(x.spend||0)},0)/n),
          impressions: String(Math.round(slice.reduce(function(a,x){return a+ +(x.impressions||0)},0)/n)),
          reach: String(Math.round(slice.reduce(function(a,x){return a+ +(x.reach||0)},0)/n)),
          clicks: String(Math.round(slice.reduce(function(a,x){return a+ +(x.clicks||0)},0)/n)),
          actions: [{
            action_type: 'offsite_conversion.fb_pixel_custom',
            value: String(Math.round(slice.reduce(function(a,x){return a+bk(x)},0)/n * 10)/10)
          }]
        };
        return avg;
      });
    }

    // --- Login ---
    document.getElementById('go').onclick = function() {
      var v = document.getElementById('pin').value.trim();
      if (!v) { document.getElementById('err').textContent='Enter a token'; return; }
      this.textContent = 'Checking\u2026';
      document.getElementById('err').textContent = '';
      fetch(API+'?t='+encodeURIComponent(v)).then(function(r){return r.json()}).then(function(j){
        if (j.ok) {
          tk = v; allRows = j.rows;
          try { localStorage.setItem('ads_t', tk); } catch(e) {}
          loginEl.classList.add('hidden');
          appEl.classList.remove('hidden');
          draw();
        } else {
          document.getElementById('err').textContent = 'Invalid token';
          document.getElementById('go').textContent = 'View Dashboard';
        }
      }).catch(function(e){
        document.getElementById('err').textContent = e.message;
        document.getElementById('go').textContent = 'View Dashboard';
      });
    };
    document.getElementById('pin').onkeydown = function(e){ if(e.key==='Enter') document.getElementById('go').click(); };

    // --- Init ---
    if (tk) {
      loginEl.classList.add('hidden');
      appEl.classList.remove('hidden');
      fetchData();
    }

    function fetchData() {
      document.getElementById('cards').innerHTML =
        '<p class="col-span-full text-center py-10 text-gray-400 text-sm">Loading\u2026</p>';
      document.getElementById('ratios').classList.add('hidden');
      document.getElementById('tbl').classList.add('hidden');

      fetch(API+'?t='+encodeURIComponent(tk)).then(function(r){return r.json()}).then(function(j){
        if (!j.ok) throw new Error(j.error);
        allRows = j.rows;
        allRows.sort(function(a,b){ return a.date_start<b.date_start?-1:1; });
        draw();
      }).catch(function(e){
        document.getElementById('cards').innerHTML =
          '<p class="col-span-full text-center py-10 text-red-500 text-sm">'+e.message+'</p>';
      });
    }

    // --- Pills ---
    document.querySelectorAll('.pill').forEach(function(b){
      b.onclick = function(){
        document.querySelectorAll('.pill').forEach(function(p){
          p.className='pill px-3 py-1 rounded-full border text-xs font-medium border-gray-300 text-gray-500';
        });
        b.className='pill px-3 py-1 rounded-full border text-xs font-medium bg-accent border-accent text-white';
        days = +b.dataset.d;
        draw();
      };
    });

    // --- Toggles ---
    cmpBox.onchange = draw;
    smoothBox.onchange = draw;

    // --- Draw ---
    function draw() {
      if (!allRows.length) return;

      var compare = cmpBox.checked;
      var smooth = smoothBox.checked;

      var current = slicePeriod(allRows, days);
      var cur = sumRows(current);
      var label = days === 0 ? 'today' : days + 'd total';

      if (compare) {
        var prev = slicePrev(allRows, days);
        var prv = sumRows(prev);
        var prevLabel = days === 0 ? 'vs yesterday' : 'vs prev ' + days + 'd';

        document.getElementById('cards').innerHTML =
          crdD('text-green-600','Spend','\u00a3'+fmt(cur.spend,2), label, dDown(cur.spend,prv.spend)) +
          crdD('text-blue-600','Impressions',fmt(cur.impr), label, dUp(cur.impr,prv.impr)) +
          crdD('text-amber-600','Clicks',fmt(cur.clicks), label, dUp(cur.clicks,prv.clicks)) +
          crdD('text-purple-600','Bookings',''+cur.bkgs, label, dUp(cur.bkgs,prv.bkgs));

        var cCPM=cur.impr?cur.spend/cur.impr*1000:0, pCPM=prv.impr?prv.spend/prv.impr*1000:0;
        var cCPC=cur.clicks?cur.spend/cur.clicks:0, pCPC=prv.clicks?prv.spend/prv.clicks:0;
        var cCTR=cur.impr?cur.clicks/cur.impr*100:0, pCTR=prv.impr?prv.clicks/prv.impr*100:0;
        var cCPB=cur.bkgs?cur.spend/cur.bkgs:0, pCPB=prv.bkgs?prv.spend/prv.bkgs:0;

        var rc = document.getElementById('ratios');
        rc.classList.remove('hidden');
        rc.innerHTML =
          crdD('text-gray-900','CPM','\u00a3'+fmt(cCPM,2), prevLabel, dDown(cCPM,pCPM)) +
          crdD('text-gray-900','CPC','\u00a3'+fmt(cCPC,2), prevLabel, dDown(cCPC,pCPC)) +
          crdD('text-gray-900','CTR',fmt(cCTR,2)+'%', prevLabel, dUp(cCTR,pCTR)) +
          crdD('text-purple-600','Cost / Bkg',cCPB?'\u00a3'+fmt(cCPB,2):'-', prevLabel, cur.bkgs&&prv.bkgs?dDown(cCPB,pCPB):'');
      } else {
        document.getElementById('cards').innerHTML =
          crd('text-green-600','Spend','\u00a3'+fmt(cur.spend,2), label) +
          crd('text-blue-600','Impressions',fmt(cur.impr), label) +
          crd('text-amber-600','Clicks',fmt(cur.clicks), label) +
          crd('text-purple-600','Bookings',''+cur.bkgs, 'appointments');

        var cCPM=cur.impr?cur.spend/cur.impr*1000:0;
        var cCPC=cur.clicks?cur.spend/cur.clicks:0;
        var cCTR=cur.impr?cur.clicks/cur.impr*100:0;

        var rc = document.getElementById('ratios');
        rc.classList.remove('hidden');
        rc.innerHTML =
          crd('text-gray-900','CPM','\u00a3'+fmt(cCPM,2),'per 1,000 impr') +
          crd('text-gray-900','CPC','\u00a3'+fmt(cCPC,2),'per click') +
          crd('text-gray-900','CTR',fmt(cCTR,2)+'%','click-through') +
          crd('text-purple-600','Cost / Bkg',cur.bkgs?'\u00a3'+fmt(cur.spend/cur.bkgs,2):'-','avg cost');
      }

      // Table
      var tableRows = smooth ? rollingAvg(current, 3) : current;
      document.getElementById('tbl-title').textContent =
        'Daily breakdown' + (smooth ? ' (3-day rolling avg)' : '');

      // Delta indicator: green = better than previous day, red = worse
      // For spend/CPC/CPM lower is better (invert); for rest higher is better
      function delta(cur, prev, invert) {
        if (prev === 0 || prev == null || cur == null) return '';
        var diff = cur - prev;
        if (Math.abs(diff) < 0.001) return '';
        var good = invert ? diff < 0 : diff > 0;
        var arrow = good ? '\u25b2' : '\u25bc';
        var color = good ? 'text-emerald-500' : 'text-red-400';
        return ' <span class="'+color+' text-[9px] delta-ind">'+arrow+'</span>';
      }

      function rowHtml(r, cls, prevR) {
        var s=+(r.spend||0),i=+(r.impressions||0),re=+(r.reach||0),c=+(r.clicks||0),b=bk(r);
        var bStr = b ? (b % 1 === 0 ? ''+b : b.toFixed(1)) : '-';
        var bHtml = b ? '<span class="bg-purple-100 text-purple-600 rounded px-1.5 py-0.5 font-semibold">'+bStr+'</span>' : '-';
        var ctr = i?c/i*100:0, cpc = c?s/c:0, cpm = i?s/i*1000:0;
        // Previous row values for deltas
        var ps=0,pi=0,pre=0,pc=0,pb=0,pctr=0,pcpc=0,pcpm=0;
        if (prevR) {
          ps=+(prevR.spend||0); pi=+(prevR.impressions||0); pre=+(prevR.reach||0);
          pc=+(prevR.clicks||0); pb=bk(prevR);
          pctr=pi?pc/pi*100:0; pcpc=pc?ps/pc:0; pcpm=pi?ps/pi*1000:0;
        }
        var d = prevR ? true : false;
        return '<tr class="border-b border-gray-100 last:border-0 '+(cls||'')+'">' +
          '<td class="text-left px-3 py-2 text-gray-500">'+fd(r.date_start)+'</td>' +
          '<td class="text-right px-3 py-2">\u00a3'+fmt(s,2)+(d?delta(s,ps,true):'')+'</td>' +
          '<td class="text-right px-3 py-2">'+fmt(i)+(d?delta(i,pi):'')+'</td>' +
          '<td class="text-right px-3 py-2">'+fmt(re)+(d?delta(re,pre):'')+'</td>' +
          '<td class="text-right px-3 py-2">'+fmt(c)+(d?delta(c,pc):'')+'</td>' +
          '<td class="text-right px-3 py-2">'+bHtml+(d?delta(b,pb):'')+'</td>' +
          '<td class="text-right px-3 py-2">'+fmt(ctr,2)+'%'+(d?delta(ctr,pctr):'')+'</td>' +
          '<td class="text-right px-3 py-2">\u00a3'+fmt(cpc,2)+(d?delta(cpc,pcpc,true):'')+'</td>' +
          '<td class="text-right px-3 py-2">\u00a3'+fmt(cpm,2)+(d?delta(cpm,pcpm,true):'')+'</td></tr>';
      }

      // Build day-over-day lookup from all processed (possibly smoothed) rows
      var allProcessed = smooth ? rollingAvg(allRows, 3) : allRows;
      var rowsByDate = {};
      allProcessed.forEach(function(r){ rowsByDate[r.date_start] = r; });

      function dayBefore(dateStr) {
        var d = new Date(dateStr);
        d.setDate(d.getDate() - 1);
        return d.toISOString().slice(0, 10);
      }

      function getPrevDay(r) {
        return rowsByDate[dayBefore(r.date_start)] || null;
      }

      var reversed = tableRows.slice().reverse();
      var html = reversed.map(function(r) {
        return rowHtml(r, '', getPrevDay(r));
      }).join('');

      if (compare) {
        var prevRows = smooth ? rollingAvg(prev, 3) : prev;
        html += '<tr><td colspan="9" class="px-3 py-1.5 text-[10px] font-bold uppercase tracking-wide text-gray-400 bg-gray-50 border-t-2 border-gray-300">Previous period</td></tr>';
        html += prevRows.slice().reverse().map(function(r){
          return rowHtml(r, 'bg-gray-50/50 text-gray-500', getPrevDay(r));
        }).join('');
      }

      document.getElementById('rows').innerHTML = html;
      document.getElementById('tbl').classList.remove('hidden');

      // --- Waterfall ---
      if (compare) {
        // Show container first so canvas can measure width
        document.getElementById('waterfall').classList.remove('hidden');
        drawSpendWaterfall(prv, cur);
        drawBookingsWaterfall(prv, cur);
      } else {
        document.getElementById('waterfall').classList.add('hidden');
      }

      var n=new Date();
      document.getElementById('foot').textContent='Updated '+n.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})+
        ' \u00b7 '+n.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
    }

    // --- Generic waterfall renderer ---
    function drawWF(canvasId, bars, prefix, decimals, invert) {
      var canvas = document.getElementById(canvasId);
      var ctx = canvas.getContext('2d');
      var dpr = window.devicePixelRatio || 1;
      var w = canvas.parentElement.offsetWidth - 24; // account for padding
      var h = 200;
      canvas.width = w * dpr;
      canvas.height = h * dpr;
      canvas.style.width = w + 'px';
      canvas.style.height = h + 'px';
      ctx.scale(dpr, dpr);
      ctx.clearRect(0, 0, w, h);

      var pad = { top: 28, bottom: 38, left: 8, right: 8 };
      var barW = Math.min(52, (w - pad.left - pad.right) / bars.length * 0.55);
      var gap = (w - pad.left - pad.right - barW * bars.length) / (bars.length + 1);
      var chartH = h - pad.top - pad.bottom;

      var running = 0;
      var positions = [];
      bars.forEach(function(b) {
        if (b.type === 'total') {
          positions.push({ top: 0, bottom: b.value, runAfter: b.value });
          running = b.value;
        } else {
          var from = running;
          running += b.value;
          positions.push({ top: Math.min(from, running), bottom: Math.max(from, running), runAfter: running });
        }
      });

      var maxVal = Math.max.apply(null, positions.map(function(p){ return p.bottom; })) * 1.18;
      if (maxVal === 0) maxVal = 1;

      function yPos(v) { return pad.top + chartH * (1 - v / maxVal); }

      ctx.font = '600 9px Inter, system-ui, sans-serif';
      ctx.textAlign = 'center';

      bars.forEach(function(b, i) {
        var x = pad.left + gap * (i + 1) + barW * i;
        var p = positions[i];
        var y1 = yPos(p.bottom);
        var y2 = yPos(p.top);
        var barH = Math.max(y2 - y1, 2);

        var posCol = invert ? '#ef4444' : '#22c55e';
        var negCol = invert ? '#22c55e' : '#ef4444';
        ctx.fillStyle = b.type === 'total' ? '#6366f1' : (b.value >= 0 ? posCol : negCol);
        ctx.beginPath();
        ctx.roundRect(x, y1, barW, barH, 3);
        ctx.fill();

        // Value label
        ctx.fillStyle = '#374151';
        var sign = b.type === 'delta' ? (b.value >= 0 ? '+' : '') : '';
        ctx.fillText(sign + prefix + Math.abs(b.value).toFixed(decimals), x + barW/2, y1 - 5);

        // Bar label
        ctx.fillStyle = '#9ca3af';
        ctx.font = '500 9px Inter, system-ui, sans-serif';
        ctx.fillText(b.label, x + barW/2, h - pad.bottom + 14);
        ctx.font = '600 9px Inter, system-ui, sans-serif';

        // Connector line from running level to next bar
        if (b.type !== 'total' || i === 0) {
          if (i < bars.length - 1) {
            var nextX = pad.left + gap * (i + 2) + barW * (i + 1);
            var connY = yPos(p.runAfter);
            ctx.strokeStyle = '#d1d5db';
            ctx.lineWidth = 1;
            ctx.setLineDash([3, 3]);
            ctx.beginPath();
            ctx.moveTo(x + barW, connY);
            ctx.lineTo(nextX, connY);
            ctx.stroke();
            ctx.setLineDash([]);
          }
        }
      });
    }

    // --- Spend waterfall: Impr volume x CPM rate ---
    function drawSpendWaterfall(prv, cur) {
      var prevCPM = prv.impr ? prv.spend / prv.impr * 1000 : 0;
      var curCPM  = cur.impr ? cur.spend / cur.impr * 1000 : 0;
      var vol  = (cur.impr - prv.impr) / 1000 * prevCPM;
      var rate = (curCPM - prevCPM) / 1000 * cur.impr;

      drawWF('wfSpend', [
        { label: 'Prev Spend', value: prv.spend, type: 'total' },
        { label: 'Volume',     value: vol,        type: 'delta' },
        { label: 'Rate (CPM)', value: rate,       type: 'delta' },
        { label: 'Cur Spend',  value: cur.spend,  type: 'total' },
      ], '\u00a3', 2, true);
    }

    // --- Bookings waterfall: Impr x CTR x Conv rate ---
    function drawBookingsWaterfall(prv, cur) {
      var pCTR  = prv.impr   ? prv.clicks / prv.impr   : 0;
      var cCTR  = cur.impr   ? cur.clicks / cur.impr   : 0;
      var pConv = prv.clicks ? prv.bkgs   / prv.clicks : 0;
      var cConv = cur.clicks ? cur.bkgs   / cur.clicks : 0;

      // 3-factor decomposition
      var volEffect  = (cur.impr - prv.impr) * pCTR * pConv;
      var ctrEffect  = cur.impr * (cCTR - pCTR) * pConv;
      var convEffect = cur.impr * cCTR * (cConv - pConv);

      drawWF('wfBook', [
        { label: 'Prev Bkgs',  value: prv.bkgs,   type: 'total' },
        { label: 'Impressions', value: volEffect,   type: 'delta' },
        { label: 'CTR',         value: ctrEffect,   type: 'delta' },
        { label: 'Conv Rate',   value: convEffect,  type: 'delta' },
        { label: 'Cur Bkgs',   value: cur.bkgs,    type: 'total' },
      ], '', 1);
    }

    // --- CSV download ---
    document.getElementById('csv-btn').onclick = function() {
      var smooth = smoothBox.checked;
      var compare = cmpBox.checked;
      var current = slicePeriod(allRows, days);
      var tableRows = smooth ? rollingAvg(current, 3) : current;

      function csvRow(r) {
        var s=+(r.spend||0),i=+(r.impressions||0),re=+(r.reach||0),c=+(r.clicks||0),b=bk(r);
        return [
          r.date_start, s.toFixed(2), i, re, c, b,
          (i?c/i*100:0).toFixed(2), (c?s/c:0).toFixed(2), (i?s/i*1000:0).toFixed(2)
        ].join(',');
      }

      var header = 'Date,Spend,Impressions,Reach,Clicks,Bookings,CTR%,CPC,CPM\n';
      var lines = tableRows.map(csvRow);

      if (compare) {
        var prev = slicePrev(allRows, days);
        var prevRows = smooth ? rollingAvg(prev, 3) : prev;
        lines.push('');
        lines.push('Previous period');
        lines = lines.concat(prevRows.map(csvRow));
      }

      var csv = header + lines.join('\n');
      var blob = new Blob([csv], { type: 'text/csv' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'fluentish-ads-' + todayStr() + '.csv';
      a.click();
      URL.revokeObjectURL(url);
    };
  </script>
</body>
</html>
